name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Keep ruff version in sync with .pre-commit-config.yaml
      - name: Install ruff
        run: pip install ruff==0.8.6

      - name: Run ruff linter
        run: ruff check --output-format=github droiduse_backend

      - name: Run ruff formatter check
        run: ruff format --check --diff droiduse_backend

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -e '.[dev]'

      - name: Run config example tests
        run: python -m pytest tests/test_config_example.py -v
